<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#14365E"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#50E6FF"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#FFFFFF">AI CoE — GenAIOps &amp; Agent-Ops Reference Architecture</text>
  <text x="40" y="78" font-size="14" fill="#50E6FF">Six layers · one registry · five lifecycle gates · all Microsoft-grounded</text>

  <!-- Layer rows -->
  <g font-size="13" fill="#0B1F3A">
    <!-- L1 -->
    <rect x="40" y="110" width="200" height="70" rx="6" fill="#0067B8"/>
    <text x="60" y="138" font-size="14" font-weight="700" fill="#FFFFFF">L1 Experience</text>
    <text x="60" y="158" font-size="11" fill="#EAF4FB">Where humans interact</text>
    <rect x="260" y="110" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#0067B8"/>
    <text x="280" y="138" font-weight="700">M365 Copilot  ·  Copilot Studio canvas  ·  Custom UI  ·  Embedded chat  ·  Voice/Teams</text>
    <text x="280" y="158" fill="#595959">Channels into every agent regardless of surface; HITL queues surface here</text>

    <!-- L2 -->
    <rect x="40" y="195" width="200" height="70" rx="6" fill="#742A9B"/>
    <text x="60" y="223" font-size="14" font-weight="700" fill="#FFFFFF">L2 Orchestration</text>
    <text x="60" y="243" font-size="11" fill="#EAF4FB">+ Registry</text>
    <rect x="260" y="195" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#742A9B"/>
    <text x="280" y="223" font-weight="700">Copilot Studio  ·  Foundry Agent Service  ·  Semantic Kernel  ·  Dataverse coe_AgentRegistry</text>
    <text x="280" y="243" fill="#595959">Single inventory of every agent across all three surfaces — the spine of GenAIOps</text>

    <!-- L3 -->
    <rect x="40" y="280" width="200" height="70" rx="6" fill="#50E6FF"/>
    <text x="60" y="308" font-size="14" font-weight="700" fill="#0B1F3A">L3 Reasoning</text>
    <text x="60" y="328" font-size="11" fill="#0B1F3A">Models + routing</text>
    <rect x="260" y="280" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#50E6FF"/>
    <text x="280" y="308" font-weight="700">Foundry catalog: OpenAI · Anthropic · Llama · Mistral · Cohere · NVIDIA NIM · Hugging Face · Microsoft Phi</text>
    <text x="280" y="328" fill="#595959">Routing chooses model by cost / latency / accuracy bound; cache lifts hit-rate</text>

    <!-- L4 -->
    <rect x="40" y="365" width="200" height="70" rx="6" fill="#0067B8"/>
    <text x="60" y="393" font-size="14" font-weight="700" fill="#FFFFFF">L4 Grounding</text>
    <text x="60" y="413" font-size="11" fill="#EAF4FB">+ Memory</text>
    <rect x="260" y="365" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#0067B8"/>
    <text x="280" y="393" font-weight="700">AI Search  ·  Cosmos DB vector  ·  Microsoft Graph  ·  Dataverse  ·  Fabric OneLake</text>
    <text x="280" y="413" fill="#595959">Retrieval, structured grounding, short- and long-term memory; Purview lineage attached</text>

    <!-- L5 -->
    <rect x="40" y="450" width="200" height="70" rx="6" fill="#742A9B"/>
    <text x="60" y="478" font-size="14" font-weight="700" fill="#FFFFFF">L5 Eval &amp; Telemetry</text>
    <text x="60" y="498" font-size="11" fill="#EAF4FB">Offline + online</text>
    <rect x="260" y="450" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#742A9B"/>
    <text x="280" y="478" font-weight="700">PromptFlow  ·  Azure AI Evaluations  ·  Application Insights  ·  Log Analytics  ·  Foundry tracing</text>
    <text x="280" y="498" fill="#595959">≥50-case reference set offline; 1-5% production sample online; drift alerts vs 30-day baseline</text>

    <!-- L6 -->
    <rect x="40" y="535" width="200" height="70" rx="6" fill="#50E6FF"/>
    <text x="60" y="563" font-size="14" font-weight="700" fill="#0B1F3A">L6 Governance</text>
    <text x="60" y="583" font-size="11" fill="#0B1F3A">&amp; Safety</text>
    <rect x="260" y="535" width="900" height="70" rx="6" fill="#EAF4FB" stroke="#50E6FF"/>
    <text x="280" y="563" font-weight="700">Content Safety  ·  Prompt Shields  ·  Purview AI Hub  ·  Defender for Cloud AI  ·  Azure Policy kill-switch</text>
    <text x="280" y="583" fill="#595959">Pre/post filtering, audit-grade evidence trail, posture management, emergency disable owned by CISO</text>
  </g>

  <!-- Lifecycle gates strip -->
  <rect x="40" y="630" width="1120" height="50" rx="6" fill="#0067B8"/>
  <text x="60" y="660" font-size="14" font-weight="700" fill="#FFFFFF">Lifecycle gates:</text>
  <g font-size="12" fill="#FFFFFF" font-weight="700">
    <text x="200" y="660">G-Build</text>
    <text x="290" y="660" fill="#50E6FF">→</text>
    <text x="320" y="660">G-Eval</text>
    <text x="400" y="660" fill="#50E6FF">→</text>
    <text x="430" y="660">G-Release</text>
    <text x="540" y="660" fill="#50E6FF">→</text>
    <text x="570" y="660">G-Monitor</text>
    <text x="680" y="660" fill="#50E6FF">→</text>
    <text x="710" y="660">G-Retire</text>
  </g>
  <text x="800" y="660" font-size="11" fill="#EAF4FB">Bound to Governance Playbook gates G1–G4 · skipped gate = written CISO sign-off in registry</text>
</svg>
